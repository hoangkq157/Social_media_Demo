# === CSDL H2 (in-memory, che do tuong thich MySQL) ===
spring.datasource.url=jdbc:h2:mem:socialdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tu tao bang tu entity
spring.jpa.hibernate.ddl-auto=update
# de data.sql chay SAU khi Hibernate tao xong bang
spring.jpa.defer-datasource-initialization=true

# Trang quan tri CSDL xem du lieu khi demo
spring.h2.console.enabled=true
