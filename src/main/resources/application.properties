# === Application Info ===
spring.application.name=social

# === Encoding (Chong loi phong tieng Viet) ===
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# === CSDL H2 (in-memory, che do tuong thich MySQL) ===
spring.datasource.url=jdbc:h2:mem:socialdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tu tao bang tu entity
spring.jpa.hibernate.ddl-auto=update
# De data.sql chay SAU khi Hibernate tao xong bang
spring.jpa.defer-datasource-initialization=true
# Tat Open Session In View de phan tang sach se, tranh lazy load ngoai service
spring.jpa.open-in-view=false
# Batch fetch size tranh N+1 query
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Trang quan tri CSDL xem du lieu khi demo
spring.h2.console.enabled=true

# Chi dung cookie cho session (khong append ;jsessionid vao URL - tranh 404 sau dang nhap)
server.servlet.session.tracking-modes=cookie

# === Upload File (Multipart) ===
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# === Cau hinh tuy bien (AppProperties) ===
app.upload.dir=./uploads
app.upload.max-image-mb=5
app.upload.max-video-mb=50
app.feed.page-size=10

# === Actuator ===
management.endpoints.web.exposure.include=health,info
