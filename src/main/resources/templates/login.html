<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment :: head('Đăng nhập — SpringBook')}"></head>
<body>
<div class="container" style="max-width: 980px; margin-top: 8vh;">
    <div class="row justify-content-center align-items-center g-5">
        <div class="col-md-5 text-md-end">
            <div class="brand" style="font-size: 3.4rem; color: #1877F2;">SpringBook</div>
            <p class="fs-5 mt-2">
                Mạng xã hội demo môn PTPM hướng đối tượng — Nhóm 2, xây dựng bằng
                <b>Spring Boot</b> và <b>H2</b>, giúp bạn kết nối và chia sẻ.
            </p>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow p-4 rounded-3">
                <div class="alert alert-danger py-2 small" th:if="${param.error}">
                    Sai tên đăng nhập hoặc mật khẩu. Vui lòng thử lại!
                </div>
                <form method="post" th:action="@{/login}">
                    <input type="text" name="username" class="form-control form-control-lg mb-3"
                           placeholder="Tên đăng nhập" required autofocus>
                    <input type="password" name="password" class="form-control form-control-lg mb-3"
                           placeholder="Mật khẩu" required>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">Đăng nhập</button>
                </form>
                <hr>
                <div class="text-center small text-muted">
                    Tài khoản mẫu: <b>an</b> · <b>binh</b> · <b>chi</b> — mật khẩu <b>123456</b>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
