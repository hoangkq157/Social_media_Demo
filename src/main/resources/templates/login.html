<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment :: head('Đăng nhập — SocialNhóm2')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 430px; margin-top: 10%;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="text-center mb-1">📘 SocialNhóm2</h3>
            <p class="text-center text-muted mb-4">Demo Spring Boot + H2 — Nhóm 2</p>

            <div class="alert alert-danger py-2" th:if="${param.error}">
                Sai tên đăng nhập hoặc mật khẩu!
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" required autofocus
                           placeholder="vd: an">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required
                           placeholder="vd: 123456">
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Tài khoản mẫu: <b>an</b> / <b>binh</b> / <b>chi</b> — mật khẩu <b>123456</b>
            </p>
        </div>
    </div>
</div>
</body>
</html>
