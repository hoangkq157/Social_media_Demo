<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy trang | SpringBook</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex align-items-center justify-content-center" style="background-color: #f0f2f5; min-height: 100vh;">
  <div class="container text-center py-5" style="max-width: 520px;">
    <div class="fb-card p-5 shadow-sm">
      <div class="display-1 fw-bold text-primary mb-3">404</div>
      <h1 class="fs-4 fw-bold mb-2" th:text="${error != null ? error : 'Không tìm thấy trang'}">Không tìm thấy trang</h1>
      <p class="text-secondary mb-4" th:text="${message != null ? message : 'Trang hoặc nội dung bạn yêu cầu không tồn tại hoặc đã bị di chuyển.'}">
        Trang hoặc nội dung bạn yêu cầu không tồn tại hoặc đã bị di chuyển.
      </p>
      <a th:href="@{/}" class="fb-btn-primary text-decoration-none px-4 py-2">
        &#8592; Quay lại Trang chủ
      </a>
    </div>
  </div>
</body>
</html>
