<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment :: head('Đăng bài — socialN2')}"></head>
<body>
<div th:replace="~{fragment :: navbar(${me}, '')}"></div>

<div class="container" style="max-width: 680px;">
  <div class="card border-0 shadow-sm rounded-3 my-4">
    <div class="card-body p-4">
      <div class="d-flex align-items-center gap-3 mb-3">
        <span class="avatar avatar-lg" th:style="'background:' + ${me.avatarColor}"
              th:text="${me.initials}">A</span>
        <div>
          <div class="fw-semibold fs-5">Tạo bài viết</div>
          <div class="text-muted small" th:text="${me.fullName}">Thành viên</div>
        </div>
      </div>
      <form method="post" th:action="@{/posts/create}">
        <input type="text" name="title" class="form-control form-control-lg rounded-4 mb-3"
               placeholder="Tiêu đề bài viết" maxlength="200" required>
        <textarea name="content" rows="7" class="form-control rounded-4 mb-3"
                  placeholder="Bạn đang nghĩ gì thế?" required></textarea>
        <div class="d-flex justify-content-end gap-2">
          <a th:href="@{/}" class="btn btn-secondary rounded-3 px-4">Hủy</a>
          <button type="submit" class="btn btn-primary fw-semibold rounded-3 px-4">Đăng bài</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
