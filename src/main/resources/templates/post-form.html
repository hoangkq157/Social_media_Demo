<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment :: head('Đăng bài — SocialNhóm2')}"></head>
<body class="bg-light">
<div th:replace="~{fragment :: navbar(${fullName})}"></div>

<div class="container" style="max-width: 640px;">
    <div class="card shadow-sm my-3">
        <div class="card-body">
            <h5 class="card-title mb-3">✏️ Đăng bài viết mới</h5>
            <form method="post" th:action="@{/posts/create}">
                <div class="mb-3">
                    <label class="form-label">Tiêu đề</label>
                    <input type="text" name="title" class="form-control" required
                           maxlength="200" placeholder="Nhập tiêu đề bài viết">
                </div>
                <div class="mb-3">
                    <label class="form-label">Nội dung</label>
                    <textarea name="content" class="form-control" rows="6" required
                              placeholder="Nhập nội dung bài viết..."></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Lưu bài</button>
                    <a th:href="@{/}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
